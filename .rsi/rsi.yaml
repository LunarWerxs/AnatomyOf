schema: hydra-rsi/1
# Committed bytes of what the Anatomy-of-a-File web app ships (app/src, app/index.html, app/public assets).
# Excluded: tests, SSR-only entry-server.ts, build-regenerated catalog.generated.ts and tokens.generated/,
# and public/sitemap.xml (prerender overwrites it in dist).
metrics:
  - id: app.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
