name: CI

# Gate every push and PR on the same checks a contributor is expected to run
# locally before opening one: bun run check (Biome plus the grammar/example
# content-integrity scripts) and bun run test (vitest over app/src/lib).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (biome, grammars, examples)
        run: bun run check

      - name: Test
        run: bun run test
