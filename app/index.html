    <noscript>
      <h1>AnatomyOf</h1>
      <p>
        AnatomyOf is an interactive, annotated tour of what's inside a source file, one
        language at a time. It opens an example source file in a code window with
        color-coded callouts explaining every structural part: shebang, imports, class
        definitions, control flow, and more. It's built for developers who want to see the
        anatomy of a language they don't know yet, or a refresher on one they do.
      </p>
      <p>
        Beyond real languages, concept pages apply the same idea to things that aren't
        code: the structural anatomy of a website, a settings screen, a mobile app, a
        dashboard, an email, a CI pipeline, and a GitHub contribution.
      </p>
      <ul>
        <li>Dozens of languages, from Python and Rust to Ada, Prolog, COBOL, GML, and WebAssembly</li>
        <li>Color-coded callouts wired to the exact lines they describe, with a full deep-dive writeup per callout</li>
        <li>Every language ships a minimal and a verbose example, each with a shareable, deep-linked URL</li>
        <li>Light and dark themes, and fully mobile-responsive</li>
        <li>Sidebar ranked by real-world popularity (TIOBE Index), toggleable to A-Z, with instant search</li>
        <li>Syntax highlighting by Shiki, the same engine VS Code uses</li>
      </ul>
      <p>This page requires JavaScript to run the interactive tour. Enable JavaScript to use AnatomyOf.</p>
    </noscript>
